name: CI

# CI basico (docs/38): valida todo PR e todo push na main.
# Escopo deliberadamente enxuto — typecheck, lint, build e os testes
# unitarios (test:unit:all = documents + phase9). SEM e2e, SEM Playwright
# browsers, SEM banco, SEM secrets, SEM rede externa. A Fase 9 permanece
# inerte: nada aqui liga execucao real nem toca Gov.br/SINARM.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancela runs antigas da mesma ref quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` roda o postinstall (prisma generate), que gera o client
      # necessario ao typecheck/build. Nenhuma variavel de banco e exigida:
      # `next build` nao chama getEnv() (validacao de ambiente e lazy).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Agrega test:documents:unit + test:phase9:unit (docs/38).
      - name: Unit tests (documents + phase9)
        run: npm run test:unit:all
